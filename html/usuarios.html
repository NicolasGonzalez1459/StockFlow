<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Usuarios | StockFlow</title>
<link rel="stylesheet" href="../css/usuarios.css?v=20260828">
</head>
<body>
<div class="layout">
  <aside class="side">
    <div class="brand"><div class="logo">SF</div>Stock<span>Flow</span></div>
    <nav id="nav"></nav>
  </aside>
  <main class="main">
    <div class="top">
      <div><h1 data-i18n="users">Usuarios</h1><div class="h-sub">HuskyTech Solutions · BT Informatica 2026</div></div>
      <div class="top-right">
        <span class="chip" id="who"></span>
        <select id="lang" style="width:auto"><option value="es">ES</option><option value="en">EN</option></select>
        <button class="btn sec" id="salir" data-i18n="logout">Salir</button>
      </div>
    </div>

    <div class="panel row">
      <div style="flex:0"><button class="btn" id="nuevo" data-i18n="new"></button></div>
    </div>
    <div class="panel">
      <table><thead><tr><th>#</th><th data-i18n="name"></th><th data-i18n="email"></th><th data-i18n="role"></th><th data-i18n="active"></th><th data-i18n="actions"></th></tr></thead><tbody id="tabla"></tbody></table>
    </div>
    <div class="modal" id="mu"><form class="box" id="fu">
      <h2 data-i18n="users"></h2>
      <label data-i18n="name"></label><input id="unombre" required>
      <label data-i18n="email"></label><input id="uemail" type="email" required>
      <label data-i18n="pass"></label><input id="upass" type="text">
      <label data-i18n="role"></label><select id="urol"><option value="admin">admin</option><option value="vendedor">vendedor</option><option value="repositor">repositor</option><option value="cliente">cliente</option></select>
      <label data-i18n="active"></label><select id="uact"><option value="1">1</option><option value="0">0</option></select>
      <div class="row" style="margin-top:16px">
        <button class="btn" data-i18n="save"></button>
        <button class="btn sec" type="button" id="cerrar" data-i18n="cancel"></button>
      </div>
    </form></div>

    <p class="foot">POLO EDUCATIVO TECNOLOGICO — CETP-UTU | Proyecto de Egreso BT Informatica 2026</p>
  </main>
</div>
<script src="../js/i18n.js?v=20260828"></script><script src="../js/app.js?v=20260828"></script><script src="../js/usuarios.js?v=20260828"></script>
</body>
</html>
