<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventario | StockFlow</title>
<link rel="stylesheet" href="../css/inventario.css?v=20260828">
</head>
<body>
<div class="layout">
  <aside class="side">
    <div class="brand"><div class="logo">SF</div>Stock<span>Flow</span></div>
    <nav id="nav"></nav>
  </aside>
  <main class="main">
    <div class="top">
      <div><h1 data-i18n="inventory">Inventario</h1><div class="h-sub">HuskyTech Solutions · BT Informatica 2026</div></div>
      <div class="top-right">
        <span class="chip" id="who"></span>
        <select id="lang" style="width:auto"><option value="es">ES</option><option value="en">EN</option></select>
        <button class="btn sec" id="salir" data-i18n="logout">Salir</button>
      </div>
    </div>

    <div class="panel row">
      <div><label data-i18n="search">Buscar</label><input id="buscar" data-i18n-ph="search"></div>
      <div style="flex:0"><button class="btn" id="nuevo" data-i18n="new">Nuevo</button></div>
    </div>
    <div class="panel">
      <table>
        <thead><tr><th data-i18n="photo">Foto</th><th data-i18n="code"></th><th data-i18n="name"></th><th data-i18n="category"></th>
        <th data-i18n="cost"></th><th data-i18n="price"></th><th data-i18n="stock"></th><th data-i18n="min"></th><th data-i18n="actions"></th></tr></thead>
        <tbody id="tabla"></tbody>
      </table>
    </div>
    <div class="panel"><h2 data-i18n="alerts"></h2>
      <table><thead><tr><th data-i18n="code"></th><th data-i18n="name"></th><th data-i18n="stock"></th><th data-i18n="min"></th></tr></thead><tbody id="alertas"></tbody></table>
    </div>
    <div class="modal" id="mp"><form class="box" id="fp">
      <h2 data-i18n="inventory"></h2>
      <label data-i18n="code"></label><input id="codigo" required>
      <label data-i18n="name"></label><input id="nombre" required>
      <label data-i18n="category"></label><select id="cat"></select>
      <label data-i18n="unit"></label><input id="unidad" value="unidad">
      <label data-i18n="cost"></label><input id="costo" type="number" step="0.01" value="0">
      <label data-i18n="price"></label><input id="precio" type="number" step="0.01" value="0">
      <label data-i18n="stock"></label><input id="stock" type="number" value="0">
      <label data-i18n="min"></label><input id="minimo" type="number" value="5">
      <label data-i18n="photo">Foto</label>
      <div class="img-row">
        <img id="imgPrev" class="img-prev">
        <input id="imgFile" type="file" accept="image/png,image/jpeg,image/webp">
      </div>
      <div class="row" style="margin-top:16px">
        <button class="btn" data-i18n="save"></button>
        <button class="btn sec" type="button" id="cerrar" data-i18n="cancel"></button>
      </div>
    </form></div>

    <p class="foot">POLO EDUCATIVO TECNOLOGICO — CETP-UTU | Proyecto de Egreso BT Informatica 2026</p>
  </main>
</div>
<script src="../js/i18n.js?v=20260828"></script><script src="../js/app.js?v=20260828"></script><script src="../js/inventario.js?v=20260828"></script>
</body>
</html>
