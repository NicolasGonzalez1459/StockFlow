<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ventas | StockFlow</title>
<link rel="stylesheet" href="../css/ventas.css?v=20260828">
</head>
<body>
<div class="layout">
  <aside class="side">
    <div class="brand"><div class="logo">SF</div>Stock<span>Flow</span></div>
    <nav id="nav"></nav>
  </aside>
  <main class="main">
    <div class="top">
      <div><h1 data-i18n="sales">Ventas</h1><div class="h-sub">HuskyTech Solutions · BT Informatica 2026</div></div>
      <div class="top-right">
        <span class="chip" id="who"></span>
        <select id="lang" style="width:auto"><option value="es">ES</option><option value="en">EN</option></select>
        <button class="btn sec" id="salir" data-i18n="logout">Salir</button>
      </div>
    </div>

    <div class="panel">
      <h2 data-i18n="register"></h2>
      <div class="row">
        <div><label data-i18n="client"></label><input id="vcli"></div>
        <div><label data-i18n="channel"></label><select id="vcanal"><option>tienda_online</option><option>marketplace</option><option>redes</option><option>presencial</option></select></div>
        <div><label data-i18n="product"></label><select id="vprod"></select></div>
        <div><label data-i18n="qty"></label><input id="vcant" type="number" min="1" value="1"></div>
        <div style="flex:0"><button class="btn sec" id="agregar" data-i18n="add"></button></div>
      </div>
      <table style="margin-top:14px"><tbody id="car"></tbody></table>
      <div class="row" style="margin-top:12px">
        <div class="right"><b data-i18n="total"></b>: <span id="tot">$0</span></div>
        <div style="flex:0"><button class="btn" id="guardar" data-i18n="save"></button></div>
      </div>
    </div>
    <div class="panel">
      <h2 data-i18n="sales"></h2>
      <table><thead><tr><th>#</th><th data-i18n="date"></th><th data-i18n="client"></th><th data-i18n="channel"></th>
      <th data-i18n="seller"></th><th data-i18n="total"></th><th data-i18n="status"></th><th data-i18n="actions"></th></tr></thead>
      <tbody id="tabla"></tbody></table>
    </div>
    <div class="modal" id="md"><div class="box">
      <h2 data-i18n="detail"></h2>
      <table><thead><tr><th data-i18n="product"></th><th data-i18n="qty"></th><th data-i18n="price"></th><th data-i18n="total"></th></tr></thead><tbody id="det"></tbody></table>
      <button class="btn sec" id="cerrar" style="margin-top:14px" data-i18n="cancel"></button>
    </div></div>

    <p class="foot">POLO EDUCATIVO TECNOLOGICO — CETP-UTU | Proyecto de Egreso BT Informatica 2026</p>
  </main>
</div>
<script src="../js/i18n.js?v=20260828"></script><script src="../js/app.js?v=20260828"></script><script src="../js/ventas.js?v=20260828"></script>
</body>
</html>
