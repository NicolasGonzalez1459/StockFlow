<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reportes | StockFlow</title>
<link rel="stylesheet" href="../css/reportes.css?v=20260828">
</head>
<body>
<div class="layout">
  <aside class="side">
    <div class="brand"><div class="logo">SF</div>Stock<span>Flow</span></div>
    <nav id="nav"></nav>
  </aside>
  <main class="main">
    <div class="top">
      <div><h1 data-i18n="reports">Reportes</h1><div class="h-sub">HuskyTech Solutions · BT Informatica 2026</div></div>
      <div class="top-right">
        <span class="chip" id="who"></span>
        <select id="lang" style="width:auto"><option value="es">ES</option><option value="en">EN</option></select>
        <button class="btn sec" id="salir" data-i18n="logout">Salir</button>
      </div>
    </div>

    <div class="panel row">
      <div><label data-i18n="reports"></label>
        <select id="rtipo">
          <option value="ventas">Ventas / Sales</option>
          <option value="stock">Stock</option>
          <option value="gastos">Gastos / Expenses</option>
          <option value="rentabilidad">Rentabilidad / Profit</option>
        </select>
      </div>
      <div><label data-i18n="from"></label><input type="date" id="desde"></div>
      <div><label data-i18n="to"></label><input type="date" id="hasta"></div>
      <div style="flex:0"><button class="btn" id="aplicar" data-i18n="apply"></button></div>
      <div style="flex:0"><button class="btn sec" id="exportar" data-i18n="export"></button></div>
    </div>
    <div class="panel"><table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></div>

    <p class="foot">POLO EDUCATIVO TECNOLOGICO — CETP-UTU | Proyecto de Egreso BT Informatica 2026</p>
  </main>
</div>
<script src="../js/i18n.js?v=20260828"></script><script src="../js/app.js?v=20260828"></script><script src="../js/reportes.js?v=20260828"></script>
</body>
</html>
